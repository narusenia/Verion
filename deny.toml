# Dependencies must allow commercial redistribution (REQ-INFRA-003, ADR-0004).
# Add an exception only after checking the redistribution terms and recording it.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]

# egui's bundled fonts. OFL-1.1 and the Ubuntu Font Licence 1.0 both allow bundling the fonts in
# software and redistributing it commercially (OFL: the font is not sold on its own; UFL: keep the
# notice). Revisit before shipping the viewer: the notices must travel with the binary.
exceptions = [
  { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

# Our own crates have no license yet (ADR-0004) and are `publish = false`.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
  # paste is unmaintained (not vulnerable) and is a build-time proc-macro pulled in by exr -> pulp.
  # Revisit when exr or pulp drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via exr -> pulp; no known vulnerability" },
]
