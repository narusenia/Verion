[package]
name = "verion-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "viewer"
path = "src/main.rs"

[dependencies]
verion-gpu = { version = "0.0.0", path = "../verion-gpu" }
verion-render-io = { version = "0.0.0", path = "../verion-render-io" }
verion-stylization = { version = "0.0.0", path = "../verion-stylization" }
verion-scene = { version = "0.0.0", path = "../verion-scene" }
verion-denoise = { version = "0.0.0", path = "../verion-denoise" }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
clap = { version = "4.6.7", features = ["derive"] }
egui_material_icons = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
verion-gpu-metal = { version = "0.0.0", path = "../verion-gpu-metal" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
verion-gpu-vulkan = { version = "0.0.0", path = "../verion-gpu-vulkan" }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = "0.37.0"
