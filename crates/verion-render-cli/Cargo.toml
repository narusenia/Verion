[package]
name = "verion-render-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "render-cli"
path = "src/main.rs"

[dependencies]
verion-gpu = { version = "0.0.0", path = "../verion-gpu" }
verion-render = { version = "0.0.0", path = "../verion-render" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
verion-render-io = { version = "0.0.0", path = "../verion-render-io" }
verion-stylization = { version = "0.0.0", path = "../verion-stylization" }
verion-scene = { version = "0.0.0", path = "../verion-scene" }
verion-denoise = { version = "0.0.0", path = "../verion-denoise" }

[target.'cfg(target_os = "macos")'.dependencies]
verion-gpu-metal = { version = "0.0.0", path = "../verion-gpu-metal" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
verion-gpu-vulkan = { version = "0.0.0", path = "../verion-gpu-vulkan" }

[lints]
workspace = true
