# GPU-free checks only. GitHub-hosted runners have no Metal RT or RTX, so tests
# and benchmarks that need a GPU run on the maintainer's machines (REQ-INFRA-002).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check
