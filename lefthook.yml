# Installed with `mise run hooks:install`. Jobs are filtered by glob so a
# docs-only commit does not pay for clippy.
pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all -- --check
    - name: clippy
      glob: "*.rs"
      run: mise run clippy
    # Needs slangc, which the CI runners do not install, so this guard is local only.
    - name: shaders
      glob: "shaders/*.slang"
      run: mise run shaders:check
